<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre>
<script>
(async()=>{const out=[];
for(const [w,h] of [[320,568],[375,667],[390,844],[414,896],[700,900],[768,1024],[1440,900]]){
 await new Promise(res=>{
  const f=document.createElement('iframe');
  f.style.cssText='position:absolute;left:0;top:0;border:0;width:'+w+'px;height:'+h+'px';
  f.src='index.html'; document.body.appendChild(f);
  setTimeout(async()=>{const d=f.contentDocument,win=f.contentWindow;
   try{await d.fonts.ready;}catch(e){}
   const st=d.createElement('style');
   st.textContent='*,*::before,*::after{animation:none!important;transition:none!important;transform:none!important;opacity:1!important}';
   d.head.appendChild(st);
   await new Promise(r=>setTimeout(r,300));
   const hero=d.querySelector('#hero').getBoundingClientRect();
   const hb=d.querySelector('header').getBoundingClientRect().bottom;
   const h1=d.querySelector('#hero h1').getBoundingClientRect();
   const dr=d.querySelector('.hero-drawer').getBoundingClientRect();
   out.push(String(w+'x'+h).padEnd(10)+'heroH='+Math.round(hero.height)+' (viewport '+win.innerHeight+')'+
    '  fillsViewport='+(Math.round(hero.bottom)>=win.innerHeight-1)+
    '  gapBelowHeader='+Math.round(h1.top-hb)+'  drawerBottom='+Math.round(dr.bottom)+
    '  overflowX='+(d.documentElement.scrollWidth>win.innerWidth+1));
   f.remove();res();},700);});}
document.getElementById('out').textContent=out.join('\n');})();
</script>
