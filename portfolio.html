<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tim Mora - Blog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
  </head>

  <body>
    <header> 
      <a href="index.html" class="header-name"> Tim Mora </a>
      <nav>
        <ul>
          <li><a style="cursor: pointer;"> Portfolio </a></li>
          <li><a href="about.html"> About </a></li>
          <li><a href="blog.html"> Blog </a></li>
        </ul>
      </nav>
    </header>

    <section id="blog">
      <h1 class="blog-header"> My Work </h1>
      <p class="entry">about me...</p>
    </section>

    <footer>
      <p> © Tim Mora 2026 </p>
      <p id="footer-quote"> "In the world through which I travel, I am endlessly creating myself." </p>
    </footer>

    <script>
      let lastScrollY = window.scrollY;
      window.addEventListener('scroll', () => {
        const header = document.querySelector('header');
        header.classList.toggle('scrolled', window.scrollY > 0);
        header.classList.toggle('hidden', window.scrollY > lastScrollY && window.scrollY > 50);
        lastScrollY = window.scrollY;
      });

    </script>
  </body>
</html>
