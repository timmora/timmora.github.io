<!DOCTYPE html>
<html lang="en" data-theme="">
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || '';</script>
  <head>
    <title>Tim Mora - Blog</title>
    <link rel="stylesheet" href="https://unpkg.com/lenis@latest/dist/lenis.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
  </head>

  <body>
    <header> 
      <a href="index.html" class="header-name"> Tim Mora </a>
      <nav>
        <ul>
          <li><a href="portfolio.html"> Portfolio </a></li>
          <li><a href="about.html"> About </a></li>
          <li><a style="cursor: pointer;"> Blog </a></li>
        </ul>
      </nav>
    </header>

    <section id="blog">
      <h1 class="blog-header"> Some of my thoughts... </h1>
      <p class="entry">about me...</p>
    </section>

    <footer>
      <p> © Tim Mora 2026 </p>
      <p id="footer-quote"> "In the world through which I travel, I am endlessly creating myself." </p>
    </footer>

    <button class="theme-toggle" id="theme-toggle">◑</button>

    <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>
    <script>
      const lenis = new Lenis({ autoRaf: true, lerp: 0.1, wheelMultiplier: 1 });

      document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = document.documentElement.dataset.theme === 'dark';
        document.documentElement.dataset.theme = isDark ? '' : 'dark';
        localStorage.setItem('theme', document.documentElement.dataset.theme);
      });

      let lastScrollY = window.scrollY;
      window.addEventListener('scroll', () => {
        const header = document.querySelector('header');
        header.classList.toggle('scrolled', window.scrollY > 0);
        header.classList.toggle('hidden', window.scrollY > lastScrollY && window.scrollY > 50);
        lastScrollY = window.scrollY;
      });

    </script>
  </body>
</html>
