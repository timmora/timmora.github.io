<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre>
<script>
(async()=>{const out=[];
for(const [p,w,scroll] of [['index.html',1440,0],['index.html',1440,1],['index.html',375,1],['about.html',1440,0],['about.html',375,0],['ordo.html',1440,1],['blog.html',1440,0]]){
 await new Promise(res=>{
  const f=document.createElement('iframe');
  f.style.cssText='position:absolute;left:0;top:0;border:0;width:'+w+'px;height:700px';
  f.src=p; document.body.appendChild(f);
  setTimeout(async()=>{const d=f.contentDocument,win=f.contentWindow;
   try{await d.fonts.ready;}catch(e){}
   const h=d.querySelector('header');
   if(scroll){h.classList.add('scrolled');await new Promise(r=>setTimeout(r,900));}
   const cs=win.getComputedStyle(h);
   out.push(p.padEnd(12)+w+(scroll?' scrolled':' top     ')+
     '  borderTop='+cs.borderTopWidth+' '+cs.borderTopStyle+
     '  borderBottom='+cs.borderBottomWidth+' '+cs.borderBottomColor+
     '  headerH='+Math.round(h.getBoundingClientRect().height));
   f.remove();res();},650);});}
document.getElementById('out').textContent=out.join('\n');})();
</script>
